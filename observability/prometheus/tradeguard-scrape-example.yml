# Merge this job into the scrape_configs section of the existing prometheus.yml.
# This file is an example fragment; it is not a standalone Prometheus configuration.
scrape_configs:
  - job_name: "tradeguard"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        # Linux Docker Engine commonly uses the bridge gateway instead:
        # targets: ["172.17.0.1:8080"]
