<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeGuard 매매</title>
<style>:root{--bg:#f3f6f8;--panel:#fff;--ink:#17212b;--muted:#647481;--line:#d8e1e7;--brand:#175d8f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1000px;margin:auto;padding:24px 18px 48px}a{color:var(--brand)}.nav{display:flex;gap:14px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px}label{display:block;font-weight:800;margin-top:10px}input,select,button{width:100%;font:inherit;border:1px solid #aebbc5;border-radius:6px;background:white;padding:9px;margin-top:4px}button{cursor:pointer;font-weight:800}.primary{background:var(--brand);border-color:var(--brand);color:white;margin-top:14px}.muted{color:var(--muted)}.warning{color:#b42318;font-weight:800}.status{font-weight:800;min-height:22px}.error{color:#b42318}.book{width:100%;border-collapse:collapse}.book td{border-top:1px solid var(--line);padding:6px 8px;text-align:right}.book button{width:auto;margin:0;padding:5px 9px}.ask{background:#fff5f5;color:#b42318}.bid{background:#eff8ff;color:#175cd3}.book .side{text-align:left}.toolbar{display:flex;gap:8px;align-items:end}.toolbar label{flex:1}.toolbar button{width:auto}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><nav class="nav"><a href="/operations/dashboard?view=market">시장 운영</a><a href="/operations/watchlist">관심종목·차트</a><a href="/operations/portfolio">보유종목</a><strong>매매</strong><a href="/operations/accounts">계좌 관리</a></nav><h1>지정가 매매</h1><p class="muted">선택 계좌 환경에 따라 KIS 모의/실전 API를 구분합니다. Readiness, kill switch, 장시간과 주문금액 제한을 모두 적용합니다.</p>
<section class="card"><label>주문 계좌<select id="account"></select></label><label id="confirmLabel"><input id="confirm" type="checkbox" style="width:auto"> 실전 계좌 주문임을 확인합니다</label></section>
<section class="card"><div class="toolbar"><label>호가 종목<select id="bookStock"></select></label><button id="chartPopup" type="button">실시간 차트</button><button id="bookRefresh" type="button">호가 재연결</button></div><p class="muted">서버가 KIS 실시간 호가 WebSocket을 구독합니다. 매도호가 선택은 매수가, 매수호가 선택은 매도가에 입력됩니다.</p><p id="bookStatus" class="status"></p><table class="book"><tbody id="orderBook"></tbody></table></section>
<div class="grid"><form id="buy" class="card"><h2>지정가 매수</h2><label>관심종목<select name="stockCode"></select></label><label>수량<input name="quantity" type="number" min="1" required value="1"></label><label>지정가<input name="price" type="number" min="1" step="1" required></label><button class="primary">매수 요청</button></form>
<form id="sell" class="card"><h2>지정가 매도</h2><p class="muted">TradeGuard 체결로 생성된 OPEN 포지션만 선택할 수 있습니다. KIS 잔고 전체는 보유종목 메뉴에서 조회합니다.</p><label>포지션<select name="positionId"></select></label><label>수량<input name="quantity" type="number" min="1" required value="1"></label><label>지정가<input name="price" type="number" min="1" step="1" required></label><button class="primary">매도 요청</button></form></div><p id="status" class="status" aria-live="polite"></p>
<script>const $=id=>document.getElementById(id),state={accounts:[],stocks:[],positions:[],bookSource:null};const request=async(url,opt={})=>{const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json()};const account=()=>state.accounts.find(a=>String(a.id)===$('account').value);const confirmed=()=>$('confirm').checked;
async function init(){try{const [accounts,stocks,positions]=await Promise.all([request('/api/trading-accounts'),request('/api/operations/portfolio/watchlist'),request('/api/live-positions')]);state.accounts=accounts.filter(a=>a.active);state.stocks=stocks.filter(s=>s.active);state.positions=positions.filter(p=>p.status==='OPEN');fill();updateAccount();startBook()}catch(e){setStatus('화면 데이터를 불러오지 못했습니다.',true)}}
function fill(){const a=$('account');state.accounts.forEach(x=>a.add(new Option(`${x.alias} · ${x.environment==='REAL'?'실전':'모의'} · ${x.maskedAccountNumber}-${x.productCode}`,x.id)));const primary=state.accounts.find(x=>x.primaryAccount);if(primary)a.value=primary.id;const stocks=$('buy').stockCode,book=$('bookStock');state.stocks.forEach(x=>{stocks.add(new Option(`${x.stockName} (${x.stockCode})`,x.stockCode));book.add(new Option(`${x.stockName} (${x.stockCode})`,x.stockCode))});const requested=new URLSearchParams(location.search).get('stockCode');if(requested&&state.stocks.some(x=>x.stockCode===requested)){stocks.value=requested;book.value=requested}const positions=$('sell').positionId;state.positions.forEach(x=>positions.add(new Option(`${x.stockCode} · ${x.environment==='REAL'?'실전':'모의'} · ${x.quantity}주`,x.id)));if(!state.positions.length)positions.add(new Option('매도 가능한 로컬 포지션 없음',''))}
function updateAccount(){$('confirm').checked=false;$('confirmLabel').className=account()?.environment==='REAL'?'warning':'';connectBook()}function setStatus(text,error=false){$('status').className=`status ${error?'error':''}`;$('status').textContent=text}async function submit(side,body){setStatus('주문 요청 중…');try{const result=await request(`/api/operations/orders/${side}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),order=result.order||result;setStatus(`${order.status} · ${order.stockCode} · ${order.quantity}주`)}catch(e){setStatus('주문이 차단되거나 실패했습니다. 계좌, 실전 확인, readiness, kill switch, 장시간과 지정가를 확인하세요.',true)}}
function connectBook(){state.bookSource?.close();state.bookSource=null;const a=account(),code=$('bookStock').value;if(!a||!code)return;$('orderBook').replaceChildren();$('bookStatus').textContent=`${code} · KIS WebSocket 연결 중…`;const source=new EventSource(`/api/stocks/orderbook/stream?stockCode=${encodeURIComponent(code)}&accountId=${a.id}`);state.bookSource=source;source.addEventListener('connected',()=>{$('bookStatus').textContent=`${code} · KIS WebSocket 구독 중 · 실시간`});source.addEventListener('orderbook',event=>renderBook(JSON.parse(event.data)));source.onerror=()=>{$('bookStatus').textContent='실시간 호가 연결이 끊겼습니다. 자동 재연결 중입니다.'}}
function renderBook(b){const body=$('orderBook');body.replaceChildren();[...b.asks].reverse().forEach(x=>body.append(bookRow('ask',`매도 ${x.level}`,x.price,x.quantity,'매수가 선택')));if(b.currentPrice){const tr=document.createElement('tr');tr.innerHTML=`<td class="side" colspan="2">현재/예상가</td><td><strong>${Number(b.currentPrice).toLocaleString('ko-KR')}</strong></td><td></td>`;body.append(tr)}b.bids.forEach(x=>body.append(bookRow('bid',`매수 ${x.level}`,x.price,x.quantity,'매도가 선택')));$('bookStatus').textContent=`${b.stockCode} · ${new Date(b.generatedAt).toLocaleTimeString('ko-KR')} · KIS WebSocket 실시간`}
function bookRow(kind,label,price,qty,action){const tr=document.createElement('tr');tr.className=kind;const side=document.createElement('td');side.className='side';side.textContent=label;const q=document.createElement('td');q.textContent=Number(qty).toLocaleString('ko-KR');const p=document.createElement('td');p.textContent=Number(price).toLocaleString('ko-KR');const cell=document.createElement('td'),button=document.createElement('button');button.type='button';button.textContent=action;button.onclick=()=>selectPrice(kind,price);cell.append(button);tr.append(side,q,p,cell);return tr}function selectPrice(kind,price){if(kind==='ask'){$('buy').stockCode.value=$('bookStock').value;$('buy').price.value=price;$('buy').scrollIntoView({behavior:'smooth'})}else{const p=state.positions.find(x=>x.stockCode===$('bookStock').value&&x.environment===account()?.environment);if(p)$('sell').positionId.value=p.id;$('sell').price.value=price;$('sell').scrollIntoView({behavior:'smooth'})}}
function startBook(){connectBook()}$('account').onchange=updateAccount;$('bookStock').onchange=()=>{ $('buy').stockCode.value=$('bookStock').value;connectBook()};$('bookRefresh').onclick=connectBook;$('chartPopup').onclick=()=>{const s=state.stocks.find(x=>x.stockCode===$('bookStock').value);if(s)window.open(`/operations/chart?stockCode=${encodeURIComponent(s.stockCode)}&stockName=${encodeURIComponent(s.stockName)}`,`chart-${s.stockCode}`,'width=1180,height=820,resizable=yes,scrollbars=yes')};$('buy').onsubmit=e=>{e.preventDefault();const a=account(),f=e.currentTarget;if(a)submit('buy',{accountId:a.id,stockCode:f.stockCode.value,quantity:+f.quantity.value,orderPrice:f.price.value,orderType:'LIMIT',realTradingConfirmed:confirmed()})};$('sell').onsubmit=e=>{e.preventDefault();const a=account(),f=e.currentTarget,p=state.positions.find(x=>String(x.id)===f.positionId.value);if(a&&p)submit('sell',{accountId:a.id,positionId:p.id,stockCode:p.stockCode,quantity:+f.quantity.value,orderPrice:f.price.value,reason:'MANUAL_UI_SELL',realTradingConfirmed:confirmed()})};addEventListener('beforeunload',()=>state.bookSource?.close());init();</script></main></body></html>
