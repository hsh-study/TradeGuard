<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeGuard 보유종목</title>
<style>:root{--bg:#f3f6f8;--panel:#fff;--ink:#17212b;--muted:#647481;--line:#d8e1e7;--brand:#175d8f;--up:#b42318;--down:#175cd3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:24px 18px 48px}a{color:var(--brand)}.nav{display:flex;gap:14px;flex-wrap:wrap}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px}label{font-weight:800}select,button{font:inherit;border:1px solid #aebbc5;border-radius:6px;background:white;padding:9px;margin-left:7px}button{cursor:pointer;font-weight:800}.muted{color:var(--muted)}.holding{border-top:1px solid var(--line);padding:15px 0}.holding:first-child{border-top:0}.tag{display:inline-block;border-radius:999px;padding:2px 8px;background:#eaf3ff;color:#175cd3;font-size:12px;font-weight:800}.tag.real{background:#fef3f2;color:#b42318}.quote{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:8px}.quote span{border:1px solid var(--line);border-radius:7px;padding:9px}.quote strong{display:block}.plus{color:var(--up)}.minus{color:var(--down)}.status{font-weight:700}.error{color:#b42318}abbr.term{text-decoration:underline dotted;cursor:help}@media(max-width:720px){.quote{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><nav class="nav"><a href="/operations/dashboard?view=market">시장 운영</a><a href="/operations/watchlist">관심종목·차트</a><strong>보유종목</strong><a href="/operations/trading">매매</a><a href="/operations/accounts">계좌 관리</a></nav><h1>보유종목</h1><p class="muted">선택 계좌의 KIS 잔고를 읽기 전용으로 조회합니다. 주문이나 자동매매 상태를 변경하지 않습니다.</p>
<section class="card"><label>조회 계좌<select id="account"></select></label><button id="refresh">새로고침</button><p id="status" class="status" aria-live="polite"></p><div id="holdings"></div></section>
<script>const $=id=>document.getElementById(id),state={accounts:[]};const request=async url=>{const r=await fetch(url);if(!r.ok)throw new Error(await r.text());return r.json()};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=(v,d=0)=>v==null?'-':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d});
async function init(){try{state.accounts=(await request('/api/trading-accounts')).filter(a=>a.active);const select=$('account');state.accounts.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=`${a.alias} · ${a.environment==='REAL'?'실전':'모의'} · ${a.maskedAccountNumber}-${a.productCode}`;select.append(o)});const primary=state.accounts.find(a=>a.primaryAccount);if(primary)select.value=primary.id;await load()}catch(e){$('status').className='status error';$('status').textContent='계좌 목록을 불러오지 못했습니다.'}}
async function load(){const id=$('account').value,box=$('holdings');if(!id){box.textContent='활성 계좌가 없습니다.';return}$('status').className='status';$('status').textContent='KIS 잔고 조회 중…';box.replaceChildren();try{const rows=await request(`/api/operations/portfolio/holdings?accountId=${encodeURIComponent(id)}`);$('status').textContent=`${rows.length}개 보유종목 · 조회 완료`;if(!rows.length){box.textContent='선택 계좌에 보유종목이 없습니다.';return}rows.forEach(h=>{const d=document.createElement('article');d.className='holding';const pnl=Number(h.unrealizedProfitLoss||0);d.innerHTML=`<span class="tag ${h.environment==='REAL'?'real':''}">${esc(h.environmentLabel)}</span> <strong>${esc(h.stockName)} (${esc(h.stockCode)})</strong><div class="quote"><span><abbr class="term" title="보유한 주식의 수">수량</abbr><strong>${n(h.quantity)}주</strong></span><span><abbr class="term" title="보유 주식의 평균 매입 가격">평균단가</abbr><strong>${n(h.averageBuyPrice)}</strong></span><span><abbr class="term" title="가장 최근 조회된 시장 가격">현재가</abbr><strong>${n(h.closePrice)}</strong></span><span><abbr class="term" title="현재가에 보유 수량을 곱한 금액">평가금액</abbr><strong>${n(h.marketValue)}</strong></span><span><abbr class="term" title="주가를 주당순이익으로 나눈 주가수익비율">PER</abbr><strong>${n(h.per,2)}</strong></span><span><abbr class="term" title="주가를 주당순자산으로 나눈 주가순자산비율">PBR</abbr><strong>${n(h.pbr,2)}</strong></span></div><p class="${pnl>0?'plus':pnl<0?'minus':''}"><abbr class="term" title="현재 평가금액에서 매입금액을 뺀 미실현 손익">평가손익</abbr> ${n(h.unrealizedProfitLoss)}원 (${n(h.unrealizedReturnRate,2)}%)</p>`;const chart=document.createElement('button');chart.textContent='실시간 차트';chart.onclick=()=>window.open(`/operations/chart?stockCode=${encodeURIComponent(h.stockCode)}&stockName=${encodeURIComponent(h.stockName)}`,`chart-${h.stockCode}`,'width=1180,height=820,resizable=yes,scrollbars=yes');d.append(chart);box.append(d)})}catch(e){$('status').className='status error';$('status').textContent='KIS 보유종목을 불러오지 못했습니다. 계좌와 KIS 설정을 확인하세요.'}}
$('account').onchange=load;$('refresh').onclick=load;init();</script></main></body></html>
