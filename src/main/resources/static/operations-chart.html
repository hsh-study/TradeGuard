<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeGuard 실시간 차트</title><style>:root{--bg:#f3f6f8;--panel:#fff;--ink:#17212b;--muted:#647481;--line:#d8e1e7;--up:#b42318;--down:#175cd3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}main{padding:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.muted{color:var(--muted)}canvas{display:block;width:100%;height:650px;border:1px solid var(--line);border-radius:7px}.summary{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}.summary strong{font-size:17px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar select{font:inherit;padding:7px;border:1px solid #aebbc5;border-radius:6px}abbr.term{text-decoration:underline dotted;cursor:help}</style></head><body><main><section class="card"><div class="toolbar"><h1 id="title">실시간 차트</h1><label><abbr class="term" title="하나의 봉이 나타내는 가격 집계 시간입니다.">차트 주기</abbr> <select id="interval"><option value="MINUTE_1">1분</option><option value="MINUTE_3">3분</option><option value="MINUTE_5" selected>5분</option><option value="MINUTE_10">10분</option><option value="MINUTE_15">15분</option><option value="MINUTE_30">30분</option><option value="MINUTE_60">60분</option><option value="DAY">일</option><option value="WEEK">주</option><option value="MONTH">월</option><option value="YEAR">년</option></select></label></div><p id="status" class="muted">불러오는 중…</p><div id="summary" class="summary"></div><canvas id="chart"></canvas></section><script>const q=new URLSearchParams(location.search),code=q.get('stockCode')||'',name=q.get('stockName')||code,$=id=>document.getElementById(id),canvas=$('chart'),ctx=canvas.getContext('2d');let points=[],stream;const n=v=>v==null?'-':Number(v).toLocaleString('ko-KR');$('title').textContent=`${name} (${code})`;const iso=d=>d.toISOString().slice(0,10),minute=()=>+$('interval').value.replace('MINUTE_','')||0;
async function load(){const to=new Date(),from=new Date(to),interval=$('interval').value;from.setDate(to.getDate()-(interval.startsWith('MINUTE_')?0:interval==='YEAR'?3650:interval==='MONTH'?1825:interval==='WEEK'?730:365));$('status').textContent='차트 데이터를 불러오는 중…';const r=await fetch(`/api/stocks/chart?stockCode=${encodeURIComponent(code)}&from=${iso(from)}&to=${iso(to)}&interval=${interval}`);if(!r.ok)throw new Error();points=(await r.json()).points;summary();draw();start()}
function start(){stream?.close();stream=new EventSource(`/api/stocks/chart/stream?stockCode=${encodeURIComponent(code)}`);stream.addEventListener('connected',()=>{$('status').textContent='실시간 연결 · 조회 전용 · 5초 간격'});stream.addEventListener('quote',e=>{const x=JSON.parse(e.data),last=points.at(-1),m=minute(),raw=x.tradeTime.slice(0,5),total=+raw.slice(0,2)*60 + +raw.slice(3),bucket=m?`${String(Math.floor((total-540)/m)*m/60+9|0).padStart(2,'0')}:${String((Math.floor((total-540)/m)*m)%60).padStart(2,'0')}`:null,same=m?last?.tradeDate===x.tradeDate&&last?.barTime?.slice(0,5)===bucket:last?.tradeDate===x.tradeDate,p={tradeDate:x.tradeDate,barTime:bucket,open:same?last.open:x.close,high:same?Math.max(+last.high,+x.close):x.close,low:same?Math.min(+last.low,+x.close):x.close,close:x.close,volume:same?last.volume:0,ma5:null,ma20:null,ma60:null};same?points[points.length-1]={...last,...p}:points.push(p);$('status').textContent=`${x.tradeTime.slice(0,8)} · ${n(x.close)}원`;summary();draw()});stream.onerror=()=>{$('status').textContent='실시간 연결 재시도 중…'}}function summary(){const p=points.at(-1);$('summary').innerHTML=p?`<span><abbr class="term" title="가장 최근 체결 가격 또는 마지막 거래일의 종가입니다.">현재/종가</abbr> <strong>${n(p.close)}</strong></span><span><abbr class="term" title="해당 봉 구간에 거래된 주식 수입니다.">거래량</abbr> <strong>${n(p.volume)}</strong></span><span><abbr class="term" title="최근 20개 봉의 종가 평균입니다.">MA20</abbr> <strong>${n(p.ma20)}</strong></span>`:''}
function resize(){const d=devicePixelRatio||1,r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}function line(key,color,x,y){ctx.beginPath();let s=false;points.forEach((p,i)=>{if(p[key]==null)return;s?ctx.lineTo(x(i),y(+p[key])):ctx.moveTo(x(i),y(+p[key]));s=true});ctx.strokeStyle=color;ctx.lineWidth=1.4;ctx.stroke()}function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);if(!points.length)return;const L=62,R=18,T=20,B=55,vals=points.flatMap(p=>[+p.low,+p.high]),min0=Math.min(...vals),max0=Math.max(...vals),pad=(max0-min0||1)*.06,min=min0-pad,max=max0+pad,step=(w-L-R)/points.length,x=i=>L+(i+.5)*step,y=v=>T+(max-v)/(max-min)*(h-T-B);ctx.font='11px system-ui';for(let i=0;i<=5;i++){const yy=T+(h-T-B)*i/5;ctx.strokeStyle='#e5e9ed';ctx.beginPath();ctx.moveTo(L,yy);ctx.lineTo(w-R,yy);ctx.stroke();ctx.fillStyle='#647481';ctx.fillText(n(max-(max-min)*i/5),3,yy+4)}points.forEach((p,i)=>{const xx=x(i),up=+p.close>=+p.open,c=up?'#b42318':'#175cd3';ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(xx,y(+p.high));ctx.lineTo(xx,y(+p.low));ctx.stroke();ctx.fillStyle=c;const top=y(Math.max(+p.open,+p.close)),bottom=y(Math.min(+p.open,+p.close));ctx.fillRect(xx-Math.max(1,step*.27),top,Math.max(2,step*.54),Math.max(1,bottom-top))});line('ma5','#7f56d9',x,y);line('ma20','#f79009',x,y);line('ma60','#344054',x,y)}$('interval').onchange=()=>load().catch(()=>{$('status').textContent='선택 주기 차트를 불러오지 못했습니다.'});new ResizeObserver(resize).observe(canvas);addEventListener('beforeunload',()=>stream?.close());load().catch(()=>{$('status').textContent='차트를 불러오지 못했습니다.'});</script></main></body></html>
