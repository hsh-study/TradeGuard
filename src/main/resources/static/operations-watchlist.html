<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TradeGuard 관심종목</title>
  <style>
    :root{--bg:#f3f6f8;--panel:#fff;--ink:#17212b;--muted:#647481;--line:#d8e1e7;--brand:#175d8f;--up:#b42318;--down:#175cd3;--good:#067647;--warn:#b54708}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1440px;margin:auto;padding:22px 18px 48px}
    a{color:var(--brand)}h1,h2{margin:0 0 10px}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:14px;box-shadow:0 1px 2px #1020300a}
    label{display:block;font-weight:700;margin-top:9px}input,select,button{font:inherit;border:1px solid #aebbc5;border-radius:6px;background:white;padding:8px}input,select{width:100%;margin-top:4px}button{cursor:pointer;font-weight:700;color:var(--ink)}button.primary{background:var(--brand);border-color:var(--brand);color:white;width:100%;margin-top:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{width:auto}.stock{padding:11px 4px;border-top:1px solid var(--line)}.stock:first-child{border-top:0}.stock button{margin-top:7px;margin-right:5px}.stock .selected{background:#eaf3fa;border-color:var(--brand)}.badge{display:inline-block;padding:2px 7px;border-radius:999px;background:#e7f6ee;color:var(--good);font-size:12px;font-weight:800}.badge.off{background:#f2f4f7;color:var(--muted)}
    #stocks{max-height:calc(100vh - 390px);min-height:120px;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding-right:5px}#stocks:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
    abbr.term{text-decoration:underline dotted;cursor:help;text-underline-offset:3px}
    .toolbar{justify-content:space-between;margin-bottom:8px}.toolbar select{min-width:115px}.toggles label{display:inline-flex;gap:5px;align-items:center;margin:0;font-weight:600}.toggles input{width:auto;margin:0}.chart-wrap{position:relative;width:100%;height:650px;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}.tooltip{display:none;position:absolute;pointer-events:none;background:#111827e8;color:white;padding:8px;border-radius:6px;font:12px/1.5 ui-monospace,SFMono-Regular,monospace;white-space:nowrap;z-index:2}.status{min-height:22px;margin:8px 0;font-weight:700}.status.error{color:#b42318}.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0}.metric{border:1px solid var(--line);border-radius:7px;padding:9px}.metric strong{display:block;font-size:16px}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:8px 0}.key:before{content:"";display:inline-block;width:14px;height:3px;background:var(--c);vertical-align:middle;margin-right:5px}.materials{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}.material{border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0}.material-head{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}.material p{margin:6px 0}.tag{display:inline-block;border-radius:999px;padding:2px 7px;background:#eef4ff;color:#3538cd;font-size:12px;font-weight:800;margin-right:5px}.tag.high{background:#fef3f2;color:#b42318}.tag.medium{background:#fffaeb;color:#b54708}.tag.source-early{background:#eaf3ff;color:#175cd3}.tag.source-closing{background:#fff1e7;color:#b54708}.tag.source-user{background:#e7f6ee;color:#067647}.title-tags{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:5px;vertical-align:middle}.quote{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px;font-size:13px}.holding{border-top:1px solid var(--line);padding:11px 0}.holding:first-child{border-top:0}.holding .pnl.plus{color:var(--up)}.holding .pnl.minus{color:var(--down)}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.chart-wrap{height:540px}.summary{grid-template-columns:repeat(2,1fr)}#stocks{max-height:50vh}}
  </style>
</head>
<body><main>
  <p><a href="/operations/dashboard?view=market">시장 운영</a> · <a href="/operations/portfolio">보유종목</a> · <a href="/operations/trading">매매</a></p>
  <h1>관심종목 관리 · 차트</h1>
  <p class="muted">등록 시 KIS 일봉 warmup과 기술지표 저장을 실행합니다. 이 화면은 관심종목·차트·재료 관리 전용입니다.</p>
  <div class="layout">
    <aside>
      <section class="card"><h2>관심종목 등록</h2>
        <form id="register">
          <label>종목코드<input name="stockCode" required pattern="[0-9A-Za-z]{1,12}" maxlength="12" placeholder="005930" autocomplete="off"></label>
          <label>종목명<input name="stockName" required maxlength="100" placeholder="삼성전자" autocomplete="off"></label>
          <label>시장<select name="market"><option>KOSPI</option><option>KOSDAQ</option></select></label>
          <button class="primary" type="submit">등록하고 데이터 수집</button>
        </form><p id="registerStatus" class="status" aria-live="polite"></p>
      </section>
      <section class="card"><div class="row" style="justify-content:space-between"><h2>등록 종목</h2><button id="reloadStocks">새로고침</button></div><div id="stocks" tabindex="0" aria-label="등록 종목 스크롤 목록">불러오는 중…</div></section>
    </aside>
    <section class="card">
      <div class="row toolbar"><div><h2 id="chartTitle">종목을 선택하세요</h2><span id="rangeText" class="muted"></span></div>
        <div class="row"><select id="interval" aria-label="차트 주기" title="하나의 봉이 나타내는 가격 집계 시간"><option value="MINUTE_1">1분봉</option><option value="MINUTE_3">3분봉</option><option value="MINUTE_5">5분봉</option><option value="MINUTE_10">10분봉</option><option value="MINUTE_15">15분봉</option><option value="MINUTE_30">30분봉</option><option value="MINUTE_60">60분봉</option><option value="DAY" selected>일봉</option><option value="WEEK">주봉</option><option value="MONTH">월봉</option><option value="YEAR">년봉</option></select><select id="period" aria-label="조회 기간" title="차트에 포함할 과거 기간"><option value="60">60일</option><option value="120" selected>120일</option><option value="240">240일</option><option value="730">2년</option><option value="1825">5년</option><option value="3650">10년</option></select><button id="collect">데이터 다시 수집</button><button id="refresh">차트 새로고침</button></div>
      </div>
      <div class="toggles row" aria-label="차트 지표"><label title="최근 5·20·60개 봉의 종가 이동평균"><input type="checkbox" data-series="ma" checked><abbr class="term" title="일정 기간 종가의 평균으로 가격 추세를 보여줍니다.">MA 5·20·60</abbr></label><label title="이동평균과 표준편차로 가격 변동 범위를 보여주는 밴드"><input type="checkbox" data-series="bb" checked><abbr class="term" title="이동평균선 위아래에 변동성 범위를 표시합니다.">볼린저밴드</abbr></label><label><input type="checkbox" data-series="rsi" checked><abbr class="term" title="상승·하락 강도를 0~100으로 나타내는 상대강도지수입니다.">RSI(14)</abbr></label><label><input type="checkbox" data-series="macd" checked><abbr class="term" title="단기·장기 이동평균 차이로 추세와 모멘텀을 보여줍니다.">MACD</abbr></label></div>
      <p id="chartStatus" class="status" aria-live="polite"></p><p id="streamStatus" class="muted">실시간 연결 대기</p><div id="summary" class="summary"></div>
      <div class="legend"><span class="key" style="--c:#7f56d9">MA5</span><span class="key" style="--c:#f79009">MA20</span><span class="key" style="--c:#344054">MA60</span><span class="key" style="--c:#12b76a">볼린저</span><span>상승 캔들: 적색 · 하락 캔들: 청색</span></div>
      <div class="chart-wrap"><canvas id="chart"></canvas><div id="tooltip" class="tooltip"></div></div>
      <section class="materials"><div class="row toolbar"><div><h2>재료 · 공시</h2><span class="muted">최근 90일 저장 내역</span></div><button id="collectMaterials">최근 30일 재료 수집</button></div>
        <p id="materialStatus" class="status" aria-live="polite">종목을 선택하세요.</p><div id="materials"></div>
      </section>
    </section>
  </div>
  <p class="muted">API: <a href="/api/stocks">관심종목</a> · <code>/api/stocks/chart?stockCode=005930&amp;from=yyyy-MM-dd&amp;to=yyyy-MM-dd</code></p>
<script>
const $=id=>document.getElementById(id), state={stocks:[],selected:null,points:[],hover:-1,stream:null};
const request=async(url,opt={})=>{const r=await fetch(url,opt);if(!r.ok)throw new Error((await r.text())||`HTTP ${r.status}`);return r.json()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sourceTagClass={'장초반':'early','종베':'closing','사용자':'user'};
const sourceTags=tags=>(tags||[]).map(tag=>`<span class="tag source-${sourceTagClass[tag]||'user'}">${esc(tag)}</span>`).join('');
async function loadStocks(){try{state.stocks=await request('/api/operations/portfolio/watchlist');renderStocks();if(!state.selected&&state.stocks.length)selectStock(state.stocks[0])}catch(e){$('stocks').textContent='목록을 불러오지 못했습니다.'}}
function renderStocks(){$('stocks').innerHTML=state.stocks.length?'':'등록된 종목이 없습니다.';state.stocks.forEach(s=>{const d=document.createElement('div');d.className='stock';d.innerHTML=`<strong>${esc(s.stockName)} <span class="muted">${esc(s.stockCode)}</span></strong><span class="title-tags">${sourceTags(s.tags)}</span> <span class="badge ${s.active?'':'off'}">${s.active?'활성':'삭제됨'}</span><div class="muted">${esc(s.market)} · ${s.latestTradeDate||'시세 없음'}</div><div class="quote"><span><abbr class="term" title="가장 최근 거래일의 마지막 체결 가격">종가</abbr> <strong>${n(s.closePrice)}</strong></span><span><abbr class="term" title="해당 거래일에 거래된 주식 수">거래량</abbr> <strong>${n(s.volume)}</strong></span><span><abbr class="term" title="주가를 주당순이익으로 나눈 주가수익비율">PER</abbr> <strong>${n(s.per,2)}</strong></span><span><abbr class="term" title="주가를 주당순자산으로 나눈 주가순자산비율">PBR</abbr> <strong>${n(s.pbr,2)}</strong></span></div>`;const view=document.createElement('button');view.textContent='차트 팝업';view.onclick=()=>window.open(`/operations/chart?stockCode=${encodeURIComponent(s.stockCode)}&stockName=${encodeURIComponent(s.stockName)}`,`chart-${s.stockCode}`,'width=1180,height=820,resizable=yes,scrollbars=yes');const trade=document.createElement('button');trade.textContent='매매';trade.onclick=()=>location.href=`/operations/trading?stockCode=${encodeURIComponent(s.stockCode)}`;const remove=document.createElement('button');remove.textContent='삭제';remove.onclick=async()=>{if(!confirm(`${s.stockName}을 관심종목에서 삭제하시겠습니까? 저장된 과거 데이터는 유지됩니다.`))return;await request(`/api/stocks/${encodeURIComponent(s.stockCode)}`,{method:'DELETE'});await loadStocks()};d.append(view,trade,remove);$('stocks').append(d)})}
async function selectStock(s){stopStream();state.selected=s;renderStocks();$('chartTitle').innerHTML=`${esc(s.stockName)} (${esc(s.stockCode)}) <span class="title-tags">${sourceTags(s.tags)}</span>`;await Promise.all([loadChart(),loadMaterials()]);startStream()}
function stopStream(){if(state.stream){state.stream.close();state.stream=null}}
function startStream(){if(!state.selected||!window.EventSource)return;const stream=new EventSource(`/api/stocks/chart/stream?stockCode=${encodeURIComponent(state.selected.stockCode)}`);state.stream=stream;$('streamStatus').textContent='실시간 연결 중…';stream.addEventListener('connected',()=>{$('streamStatus').textContent='실시간 연결 · 조회 전용 · 5초 간격'});stream.addEventListener('quote',event=>{if(stream!==state.stream)return;const q=JSON.parse(event.data),last=state.points.at(-1),sameDay=last?.tradeDate===q.tradeDate,point={tradeDate:q.tradeDate,open:sameDay?last.open:q.open,high:q.high,low:q.low,close:q.close,volume:q.cumulativeVolume,tradingValue:q.cumulativeTradingValue,ma5:null,ma20:null,ma60:null,rsi14:null,macd:null,macdSignal:null,macdHistogram:null,bollingerUpper:null,bollingerMiddle:null,bollingerLower:null};if(sameDay)state.points[state.points.length-1]={...last,...point};else state.points.push(point);$('streamStatus').textContent=`실시간 ${q.tradeTime.slice(0,8)} · ${n(q.close)}원 · 누적 ${n(q.cumulativeVolume)}주`;summary();draw()});stream.onerror=()=>{$('streamStatus').textContent='실시간 연결 재시도 중…'}}
function iso(d){return d.toISOString().slice(0,10)}
async function loadChart(){if(!state.selected)return;const interval=$('interval').value,days=interval.startsWith('MINUTE_')?0:+$('period').value,to=new Date(),from=new Date(to);from.setDate(to.getDate()-days);$('chartStatus').className='status';$('chartStatus').textContent=interval.startsWith('MINUTE_')?'KIS 당일 분봉을 불러오는 중…':'DB 차트 데이터를 불러오는 중…';try{const data=await request(`/api/stocks/chart?stockCode=${encodeURIComponent(state.selected.stockCode)}&from=${iso(from)}&to=${iso(to)}&interval=${interval}`);state.points=data.points;$('rangeText').textContent=`${data.from} ~ ${data.to} · ${data.dataPointCount}개 ${intervalLabel(interval)}`;$('chartStatus').textContent=data.points.length?'조회 데이터 기준':'선택한 주기의 시세가 없습니다.';summary();draw()}catch(e){state.points=[];$('chartStatus').className='status error';$('chartStatus').textContent='차트 데이터를 불러오지 못했습니다.';draw()}}
function intervalLabel(v){return v.startsWith('MINUTE_')?`${v.slice(7)}분봉`:{DAY:'일봉',WEEK:'주봉',MONTH:'월봉',YEAR:'년봉'}[v]}
async function collect(){if(!state.selected)return;$('chartStatus').textContent='KIS 일봉과 지표를 수집하는 중…';try{const r=await request(`/api/indicators/warm-up?stockCode=${encodeURIComponent(state.selected.stockCode)}`,{method:'POST'});$('chartStatus').textContent=`수집 ${r.status} · 신규 ${r.importedDailyPriceCount}건 · 총 ${r.totalDailyPriceCount}건`;await loadChart()}catch(e){$('chartStatus').className='status error';$('chartStatus').textContent='수집에 실패했습니다. KIS 설정과 운영 상태를 확인하세요.'}}
async function loadMaterials(){if(!state.selected)return;const box=$('materials'),status=$('materialStatus');status.className='status';status.textContent='저장된 재료를 불러오는 중…';try{const rows=await request(`/api/stocks/${encodeURIComponent(state.selected.stockCode)}/materials`);box.replaceChildren(...rows.map(materialNode));status.textContent=rows.length?`${rows.length}건 · 최신순`:'저장된 재료가 없습니다.'}catch(e){box.replaceChildren();status.className='status error';status.textContent='재료 목록을 불러오지 못했습니다.'}}
function materialNode(row){const el=document.createElement('article');el.className='material';const head=document.createElement('div');head.className='material-head';const title=document.createElement('strong');title.textContent=row.title;const time=document.createElement('time');time.className='muted';time.textContent=row.publishedAt?new Date(row.publishedAt).toLocaleString('ko-KR'):'발행시각 없음';head.append(title,time);const tags=document.createElement('div');[[row.importance,'importance'],[row.catalystType,'type'],[row.evidenceType,'evidence']].filter(x=>x[0]).forEach(([value])=>{const tag=document.createElement('span');tag.className=`tag ${String(value).toLowerCase()}`;tag.textContent=value;tags.append(tag)});const summary=document.createElement('p');summary.textContent=row.summary;el.append(head,tags,summary);return el}
async function collectMaterials(){if(!state.selected)return;const status=$('materialStatus');status.className='status';status.textContent='DART에서 최근 30일 재료를 수집하는 중…';try{const r=await request(`/api/stocks/${encodeURIComponent(state.selected.stockCode)}/materials/collect`,{method:'POST'});await loadMaterials();status.className=r.status==='FAILED'?'status error':'status';status.textContent=`${r.status} · 신규 ${r.importedCount}건 · ${r.message}`}catch(e){status.className='status error';status.textContent='재료 수집에 실패했습니다. DART 설정과 Disclosure Provider 상태를 확인하세요.'}}
function n(v,d=0){return v==null?'-':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d})}
function summary(){const p=state.points.at(-1);$('summary').innerHTML=p?`<div class="metric"><span>종가</span><strong>${n(p.close)}</strong></div><div class="metric"><span>거래량</span><strong>${n(p.volume)}</strong></div><div class="metric"><span>MA20</span><strong>${n(p.ma20,2)}</strong></div><div class="metric"><span>RSI14</span><strong>${n(p.rsi14,2)}</strong></div><div class="metric"><span>MACD</span><strong>${n(p.macd,2)}</strong></div>`:''}
const canvas=$('chart'),ctx=canvas.getContext('2d'),tip=$('tooltip');
function enabled(k){return document.querySelector(`[data-series="${k}"]`).checked}
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}
function line(points,key,color,x,y){ctx.beginPath();let started=false;points.forEach((p,i)=>{if(p[key]==null)return;const xx=x(i),yy=y(+p[key]);started?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);started=true});ctx.strokeStyle=color;ctx.lineWidth=1.35;ctx.stroke()}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);const ps=state.points;if(!ps.length){ctx.fillStyle='#647481';ctx.font='14px system-ui';ctx.fillText('표시할 데이터가 없습니다.',24,40);return}const L=58,R=16,T=18;const showR=enabled('rsi'),showM=enabled('macd');const lower=(showR?90:0)+(showM?105:0),priceBottom=h-lower-82,volTop=priceBottom+8,volBottom=priceBottom+72;const plotW=w-L-R,step=plotW/ps.length,x=i=>L+(i+.5)*step;const vals=ps.flatMap(p=>[+p.low,+p.high,enabled('bb')&&p.bollingerLower!=null?+p.bollingerLower:null,enabled('bb')&&p.bollingerUpper!=null?+p.bollingerUpper:null]).filter(v=>v!=null);let min=Math.min(...vals),max=Math.max(...vals),pad=(max-min||1)*.06;min-=pad;max+=pad;const y=v=>T+(max-v)/(max-min)*(priceBottom-T);ctx.strokeStyle='#e5e9ed';ctx.lineWidth=1;ctx.fillStyle='#647481';ctx.font='11px system-ui';for(let i=0;i<=4;i++){const yy=T+(priceBottom-T)*i/4,val=max-(max-min)*i/4;ctx.beginPath();ctx.moveTo(L,yy);ctx.lineTo(w-R,yy);ctx.stroke();ctx.fillText(n(val),4,yy+4)}const maxVol=Math.max(...ps.map(p=>p.volume),1);ps.forEach((p,i)=>{const xx=x(i),up=+p.close>=+p.open,color=up?'#b42318':'#175cd3';ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(xx,y(+p.high));ctx.lineTo(xx,y(+p.low));ctx.stroke();const top=y(Math.max(+p.open,+p.close)),bottom=y(Math.min(+p.open,+p.close));ctx.fillStyle=color;ctx.fillRect(xx-Math.max(1,step*.28),top,Math.max(2,step*.56),Math.max(1,bottom-top));const vh=(p.volume/maxVol)*(volBottom-volTop);ctx.globalAlpha=.55;ctx.fillRect(xx-Math.max(1,step*.28),volBottom-vh,Math.max(2,step*.56),vh);ctx.globalAlpha=1});if(enabled('ma')){line(ps,'ma5','#7f56d9',x,y);line(ps,'ma20','#f79009',x,y);line(ps,'ma60','#344054',x,y)}if(enabled('bb')){line(ps,'bollingerUpper','#12b76a',x,y);line(ps,'bollingerMiddle','#12b76a88',x,y);line(ps,'bollingerLower','#12b76a',x,y)}ctx.fillStyle='#647481';ctx.fillText('거래량',4,volTop+12);let panel=volBottom+8;if(showR){const top=panel,bottom=top+82,yr=v=>bottom-(v/100)*(bottom-top);ctx.fillText('RSI',4,top+12);[30,70].forEach(v=>{ctx.strokeStyle='#d0d5dd';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(L,yr(v));ctx.lineTo(w-R,yr(v));ctx.stroke();ctx.setLineDash([])});line(ps,'rsi14','#7f56d9',x,yr);panel=bottom+8}if(showM){const top=panel,bottom=h-18,all=ps.flatMap(p=>[p.macd,p.macdSignal,p.macdHistogram]).filter(v=>v!=null).map(Number),abs=Math.max(...all.map(Math.abs),1),ym=v=>(top+bottom)/2-v/abs*(bottom-top)*.42;ctx.fillText('MACD',4,top+12);ctx.strokeStyle='#d0d5dd';ctx.beginPath();ctx.moveTo(L,ym(0));ctx.lineTo(w-R,ym(0));ctx.stroke();ps.forEach((p,i)=>{if(p.macdHistogram==null)return;ctx.fillStyle=+p.macdHistogram>=0?'#b4231888':'#175cd388';const yy=ym(+p.macdHistogram);ctx.fillRect(x(i)-Math.max(1,step*.2),Math.min(ym(0),yy),Math.max(2,step*.4),Math.abs(yy-ym(0)))});line(ps,'macd','#175d8f',x,ym);line(ps,'macdSignal','#f79009',x,ym)}if(state.hover>=0&&state.hover<ps.length){const xx=x(state.hover);ctx.strokeStyle='#475467';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(xx,T);ctx.lineTo(xx,h-18);ctx.stroke();ctx.setLineDash([])}}
canvas.addEventListener('mousemove',e=>{if(!state.points.length)return;const r=canvas.getBoundingClientRect(),L=58,plot=canvas.clientWidth-L-16,i=Math.max(0,Math.min(state.points.length-1,Math.floor((e.clientX-r.left-L)/plot*state.points.length)));state.hover=i;const p=state.points[i];tip.style.display='block';tip.style.left=Math.min(canvas.clientWidth-190,e.clientX-r.left+12)+'px';tip.style.top=Math.max(6,e.clientY-r.top-72)+'px';tip.textContent=`${p.tradeDate}  O ${n(p.open)}  H ${n(p.high)}  L ${n(p.low)}  C ${n(p.close)}  V ${n(p.volume)}`;draw()});canvas.addEventListener('mouseleave',()=>{state.hover=-1;tip.style.display='none';draw()});
$('register').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,s=$('registerStatus');s.className='status';s.textContent='등록 및 데이터 수집 중…';try{const r=await request('/api/stocks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stockCode:f.stockCode.value.trim(),stockName:f.stockName.value.trim(),market:f.market.value})});s.textContent=`등록 완료 · 수집 ${r.warmUp.status} · ${r.warmUp.totalDailyPriceCount}건`;f.reset();await loadStocks();const found=state.stocks.find(x=>x.stockCode===r.stockCode);if(found)await selectStock(found)}catch(err){s.className='status error';s.textContent='등록하지 못했습니다. 입력값과 KIS 설정을 확인하세요.'}});
$('reloadStocks').onclick=loadStocks;$('refresh').onclick=loadChart;$('collect').onclick=collect;$('collectMaterials').onclick=collectMaterials;$('period').onchange=loadChart;$('interval').onchange=loadChart;document.querySelectorAll('[data-series]').forEach(x=>x.onchange=draw);window.addEventListener('beforeunload',stopStream);new ResizeObserver(resize).observe(canvas);loadStocks();
</script></main></body></html>
