tradeguard.disclosure-actual-provider.type=${DISCLOSURE_ACTUAL_PROVIDER_TYPE:DART}
tradeguard.disclosure-actual-provider.timeout-seconds=${DISCLOSURE_ACTUAL_PROVIDER_TIMEOUT_SECONDS:10}
tradeguard.disclosure-actual-provider.auto-run=${DISCLOSURE_ACTUAL_PROVIDER_AUTO_RUN:false}
tradeguard.disclosure-actual-provider.lookback-days=${DISCLOSURE_ACTUAL_PROVIDER_LOOKBACK_DAYS:7}
tradeguard.disclosure-actual-provider.max-items-per-stock=${DISCLOSURE_ACTUAL_PROVIDER_MAX_ITEMS_PER_STOCK:20}
tradeguard.disclosure-actual-provider.rate-limit-per-minute=${DISCLOSURE_ACTUAL_PROVIDER_RATE_LIMIT_PER_MINUTE:30}
