tradeguard.indicator.warmup.min-required-days-for-ma60=${INDICATOR_WARMUP_MIN_REQUIRED_DAYS_FOR_MA60:60}
tradeguard.indicator.warmup.fail-strategy-when-insufficient=${INDICATOR_WARMUP_FAIL_STRATEGY_WHEN_INSUFFICIENT:false}
tradeguard.indicator.warmup.max-symbols-per-run=${INDICATOR_WARMUP_MAX_SYMBOLS_PER_RUN:100}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=tradeguard
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} [requestId=%X{requestId:-} correlationId=%X{correlationId:-}] %msg %kvp%n%wEx
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,flywayMigration,kisReadOnly,kisOAuthToken,discordNotification,scheduler,marketCalendar,investorFlowProvider
