spring.application.name=TradeGuard
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tradeguard?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:tradeguard}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
tradeguard.real-trading-enabled=false
tradeguard.live-trading.live-trading-enabled=${LIVE_TRADING_ENABLED:false}
tradeguard.live-trading.kis-trading-enabled=${KIS_TRADING_ENABLED:false}
tradeguard.live-trading.account-number=${KIS_ACCOUNT_NUMBER:}
tradeguard.live-trading.account-product-code=${KIS_ACCOUNT_PRODUCT_CODE:}
tradeguard.live-trading.kis-environment=${KIS_TRADING_ENVIRONMENT:REAL}
tradeguard.live-trading.buy-commission-rate=${LIVE_BUY_COMMISSION_RATE:0.00015}
tradeguard.live-trading.sell-commission-rate=${LIVE_SELL_COMMISSION_RATE:0.00015}
tradeguard.live-trading.sell-tax-rate=${LIVE_SELL_TAX_RATE:0.0020}
tradeguard.live-trading.minimum-net-profit-amount=${LIVE_MINIMUM_NET_PROFIT_AMOUNT:0}
tradeguard.live-trading.max-loss-amount-per-position=${LIVE_MAX_LOSS_AMOUNT_PER_POSITION:30000}
tradeguard.live-trading.default-take-profit-rate=${LIVE_DEFAULT_TAKE_PROFIT_RATE:5.0}
tradeguard.live-trading.default-stop-loss-rate=${LIVE_DEFAULT_STOP_LOSS_RATE:-3.0}
tradeguard.live-trading.high-price-threshold1=${LIVE_HIGH_PRICE_THRESHOLD1:50000}
tradeguard.live-trading.high-price-threshold2=${LIVE_HIGH_PRICE_THRESHOLD2:200000}
tradeguard.live-trading.max-allowed-order-amount=${LIVE_MAX_ALLOWED_ORDER_AMOUNT:1000000}
tradeguard.live-trading.allowed-order-type=LIMIT
tradeguard.live-trading.live-order-auto-cancel-enabled=${LIVE_ORDER_AUTO_CANCEL_ENABLED:false}
tradeguard.live-trading.buy-order-expire-minutes=${LIVE_BUY_ORDER_EXPIRE_MINUTES:3}
tradeguard.live-trading.sell-order-expire-minutes=${LIVE_SELL_ORDER_EXPIRE_MINUTES:3}
tradeguard.live-trading.cancel-before-market-close-minutes=${LIVE_CANCEL_BEFORE_MARKET_CLOSE_MINUTES:5}
tradeguard.kis.environment=${KIS_READ_ONLY_ENVIRONMENT:DEMO}
tradeguard.kis.real-base-url=https://openapi.koreainvestment.com:9443
tradeguard.kis.demo-base-url=https://openapivts.koreainvestment.com:29443
tradeguard.kis.token-path=/oauth2/tokenP
tradeguard.kis.app-key=${KIS_APP_KEY:}
tradeguard.kis.app-secret=${KIS_APP_SECRET:}
tradeguard.kis.token-refresh-before-seconds=${KIS_TOKEN_REFRESH_BEFORE_SECONDS:600}
tradeguard.kis.token-daily-refresh-enabled=${KIS_TOKEN_DAILY_REFRESH_ENABLED:true}
tradeguard.kis.token-issue-time-kst=${KIS_TOKEN_ISSUE_TIME_KST:07:30}
tradeguard.kis.token-cache-mode=${KIS_TOKEN_CACHE_MODE:MEMORY}
tradeguard.kis.token-encryption-key=${KIS_TOKEN_ENCRYPTION_KEY:}
tradeguard.kis.token-refresh-lock-timeout-seconds=${KIS_TOKEN_REFRESH_LOCK_TIMEOUT_SECONDS:120}
tradeguard.kis.token-refresh-lock-wait-seconds=${KIS_TOKEN_REFRESH_LOCK_WAIT_SECONDS:10}
tradeguard.kis.base-url-override=${KIS_BASE_URL_OVERRIDE:}
tradeguard.market-data.realtime-provider=${MARKET_DATA_REALTIME_PROVIDER:fake}
tradeguard.market-data.intraday-provider=${MARKET_DATA_INTRADAY_PROVIDER:fake}
tradeguard.market-data.after-hours-provider=${AFTER_HOURS_DATA_PROVIDER:}
tradeguard.market-data.after-hours-enabled=${AFTER_HOURS_DATA_ENABLED:true}
tradeguard.market-calendar.holidays=${MARKET_CALENDAR_HOLIDAYS:}
tradeguard.market-calendar.krx-endpoint=${MARKET_CALENDAR_KRX_ENDPOINT:}
tradeguard.notification.discord.webhook-url=${DISCORD_WEBHOOK_URL:}
tradeguard.research.morning-note-discord-enabled=${RESEARCH_MORNING_NOTE_DISCORD_ENABLED:false}
tradeguard.order.retry-stuck-threshold-minutes=${ORDER_RETRY_STUCK_THRESHOLD_MINUTES:5}
tradeguard.early-market.strategy.pre-open.after-hours-rise-threshold=${EARLY_MARKET_AFTER_HOURS_RISE_THRESHOLD:3.0}
tradeguard.early-market.strategy.pre-open.after-hours-rise-score=${EARLY_MARKET_AFTER_HOURS_RISE_SCORE:15}
tradeguard.early-market.strategy.pre-open.after-hours-trading-value-threshold=${EARLY_MARKET_AFTER_HOURS_TRADING_VALUE_THRESHOLD:30000000000}
tradeguard.early-market.strategy.pre-open.after-hours-trading-value-score=${EARLY_MARKET_AFTER_HOURS_TRADING_VALUE_SCORE:15}
tradeguard.early-market.strategy.pre-open.after-hours-overheat-threshold=${EARLY_MARKET_AFTER_HOURS_OVERHEAT_THRESHOLD:7.0}
tradeguard.early-market.strategy.pre-open.after-hours-overheat-penalty=${EARLY_MARKET_AFTER_HOURS_OVERHEAT_PENALTY:-10}
tradeguard.early-market.strategy.pre-open.after-hours-fall-threshold=${EARLY_MARKET_AFTER_HOURS_FALL_THRESHOLD:-3.0}
tradeguard.early-market.strategy.pre-open.after-hours-fall-penalty=${EARLY_MARKET_AFTER_HOURS_FALL_PENALTY:-10}
tradeguard.early-market.strategy.opening.vwap-above-score=${EARLY_MARKET_VWAP_ABOVE_SCORE:25}
tradeguard.early-market.strategy.opening.near-high-score=${EARLY_MARKET_NEAR_HIGH_SCORE:20}
tradeguard.early-market.strategy.opening.trading-value-score=${EARLY_MARKET_TRADING_VALUE_SCORE:20}
tradeguard.early-market.strategy.opening.vwap-broken-penalty=${EARLY_MARKET_VWAP_BROKEN_PENALTY:-30}
tradeguard.early-market.strategy.opening.high-drawdown-penalty=${EARLY_MARKET_HIGH_DRAWDOWN_PENALTY:-20}
tradeguard.early-market.strategy.opening.entry-threshold=${EARLY_MARKET_ENTRY_THRESHOLD:70}
tradeguard.early-market.strategy.opening.max-candidates=${EARLY_MARKET_MAX_CANDIDATES:3}
tradeguard.early-market.strategy.follow-up.exclude-drawdown-from-high=${EARLY_MARKET_EXCLUDE_DRAWDOWN_FROM_HIGH:-2.0}
tradeguard.early-market.strategy.follow-up.caution-drawdown-from-high=${EARLY_MARKET_CAUTION_DRAWDOWN_FROM_HIGH:-1.0}
tradeguard.early-market.strategy.follow-up.exclude-when-last-below-vwap=${EARLY_MARKET_EXCLUDE_WHEN_LAST_BELOW_VWAP:true}
tradeguard.early-market.strategy.follow-up.exclude-when-last-below-opening-price=${EARLY_MARKET_EXCLUDE_WHEN_LAST_BELOW_OPENING_PRICE:true}
tradeguard.early-market.strategy.follow-up.caution-when-previous-high-not-broken=${EARLY_MARKET_CAUTION_WHEN_PREVIOUS_HIGH_NOT_BROKEN:true}
tradeguard.early-market.strategy.follow-up.caution-when-previous-high-re-lost=${EARLY_MARKET_CAUTION_WHEN_PREVIOUS_HIGH_RE_LOST:true}
tradeguard.early-market.strategy.price-action.previous-high-breakout-score=${EARLY_MARKET_PREVIOUS_HIGH_BREAKOUT_SCORE:15}
tradeguard.early-market.strategy.price-action.previous-high-not-broken-penalty=${EARLY_MARKET_PREVIOUS_HIGH_NOT_BROKEN_PENALTY:-10}
tradeguard.early-market.strategy.price-action.opening-price-held-score=${EARLY_MARKET_OPENING_PRICE_HELD_SCORE:10}
tradeguard.early-market.strategy.price-action.opening-price-lost-penalty=${EARLY_MARKET_OPENING_PRICE_LOST_PENALTY:-15}
tradeguard.indicator.warmup.enabled=${INDICATOR_WARMUP_ENABLED:true}
tradeguard.indicator.warmup.lookback-trading-days=${INDICATOR_WARMUP_LOOKBACK_TRADING_DAYS:120}
tradeguard.indicator.warmup.min-required-days-for-ma60=${INDICATOR_WARMUP_MIN_REQUIRED_DAYS_FOR_MA60:60}
tradeguard.indicator.warmup.fail-strategy-when-insufficient=${INDICATOR_WARMUP_FAIL_STRATEGY_WHEN_INSUFFICIENT:false}
tradeguard.indicator.warmup.max-symbols-per-run=${INDICATOR_WARMUP_MAX_SYMBOLS_PER_RUN:100}
management.endpoints.web.exposure.include=health,info,metrics
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} [requestId=%X{requestId:-} correlationId=%X{correlationId:-}] %msg %kvp%n%wEx
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,flywayMigration,kisReadOnly,kisOAuthToken,discordNotification,scheduler,marketCalendar
