spring.application.name=TradeGuard
spring.datasource.url=${DB_URL:jdbc:h2:mem:tradeguard;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
tradeguard.real-trading-enabled=false
tradeguard.kis.base-url=${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
tradeguard.kis.app-key=${KIS_APP_KEY:}
tradeguard.kis.app-secret=${KIS_APP_SECRET:}
tradeguard.market-data.realtime-provider=${MARKET_DATA_REALTIME_PROVIDER:fake}
tradeguard.market-data.after-hours-enabled=${AFTER_HOURS_DATA_ENABLED:true}
tradeguard.market-calendar.holidays=${MARKET_CALENDAR_HOLIDAYS:}
tradeguard.notification.discord.webhook-url=${DISCORD_WEBHOOK_URL:}
tradeguard.order.retry-stuck-threshold-minutes=${ORDER_RETRY_STUCK_THRESHOLD_MINUTES:5}
management.endpoints.web.exposure.include=health,info,metrics
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} [requestId=%X{requestId:-} correlationId=%X{correlationId:-}] %msg %kvp%n%wEx
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,flywayMigration,kisReadOnly,discordNotification,scheduler
