spring.application.name=TradeGuard
tradeguard.environment=${TRADEGUARD_ENVIRONMENT:LOCAL}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tradeguard?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:tradeguard}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
tradeguard.real-trading-enabled=false
tradeguard.live-trading.live-trading-enabled=${LIVE_TRADING_ENABLED:false}
tradeguard.live-trading.kis-trading-enabled=${KIS_TRADING_ENABLED:false}
tradeguard.live-trading.account-number=${KIS_ACCOUNT_NUMBER:}
tradeguard.live-trading.account-product-code=${KIS_ACCOUNT_PRODUCT_CODE:}
tradeguard.live-trading.buy-commission-rate=${LIVE_BUY_COMMISSION_RATE:0.00015}
tradeguard.live-trading.sell-commission-rate=${LIVE_SELL_COMMISSION_RATE:0.00015}
tradeguard.live-trading.sell-tax-rate=${LIVE_SELL_TAX_RATE:0.0020}
tradeguard.live-trading.minimum-net-profit-amount=${LIVE_MINIMUM_NET_PROFIT_AMOUNT:0}
tradeguard.live-trading.max-loss-amount-per-position=${LIVE_MAX_LOSS_AMOUNT_PER_POSITION:30000}
