tradeguard.research.news.naver.max-symbols-per-run=${NAVER_NEWS_MAX_SYMBOLS_PER_RUN:20}
tradeguard.research.news.naver.morning-note-top-n=${NAVER_NEWS_MORNING_NOTE_TOP_N:5}
